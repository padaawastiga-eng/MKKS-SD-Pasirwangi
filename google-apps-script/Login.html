<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Masuk Portal | MKKS SD Pasirwangi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4 text-slate-800">

  <div class="w-full max-w-md bg-white border border-slate-200 shadow-2xl rounded-2xl overflow-hidden transition-all duration-300">
    
    <!-- Top banner -->
    <div class="bg-gradient-to-r from-sky-500 to-indigo-600 p-6 text-white text-center relative">
      <a href="?page=home" class="absolute top-4 left-4 p-2 rounded-lg bg-white/10 text-white hover:bg-white/20 transition text-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-2 text-xl">
        <i class="bi bi-person-lock"></i>
      </div>
      <h2 class="font-extrabold text-lg leading-none mt-1">Sistem Portal MKKS SD</h2>
      <span class="text-[10px] text-sky-200 block uppercase font-bold tracking-wider mt-1.5">Kecamatan Pasirwangi</span>
    </div>

    <!-- Login Form wrapper -->
    <div class="p-6 sm:p-8 space-y-4">
      <div id="errorAlert" class="hidden flex items-start gap-2 p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-150">
        <i class="bi bi-exclamation-triangle-fill mt-0.5 shrink-0"></i>
        <span id="errorAlertMsg">Username atau Password salah!</span>
      </div>

      <div class="text-center">
        <h3 class="font-bold text-slate-800 text-base">Masuk Sistem</h3>
        <p class="text-xs text-slate-400">Gunakan kredensial akun Anda</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); validateLogin();" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-650 uppercase tracking-wide mb-1.5">Username / Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-person text-sm"></i>
            </span>
            <input
              type="text"
              id="usernameInput"
              required
              placeholder="Admin atau email@sekolah.com"
              class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-indigo-500 focus:bg-white text-xs outline-none transition"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-650 uppercase tracking-wide mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="bi bi-key text-sm"></i>
            </span>
            <input
              type="password"
              id="passwordInput"
              required
              placeholder="••••••••"
              class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-indigo-500 focus:bg-white text-xs outline-none transition"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 font-bold rounded-xl text-white text-xs transition tracking-wide active:scale-95 duration-150 cursor-pointer"
        >
          Masuk Sekarang
        </button>
      </form>

      <div class="text-center pt-3 border-t border-slate-100 text-[11px] text-slate-400">
        Butuh akun baru? Silakan hubungi Sekretariat MKKS.<br>
        <div class="mt-2 text-[10px] bg-slate-50 p-2 text-slate-500 leading-normal rounded-xl border border-slate-150 max-w-xs mx-auto text-left">
          🔑 Admin: Username <code class="bg-indigo-50 p-0.5 rounded text-indigo-700 font-black">Admin</code>, Pass <code class="bg-indigo-50 p-0.5 rounded text-indigo-700 font-black">mkks037</code><br/>
          🔑 User: Username <code class="bg-indigo-50 p-0.5 rounded text-indigo-700 font-black">user@test.com</code>, Pass <code class="bg-indigo-50 p-0.5 rounded text-indigo-700 font-black">password123</code>
        </div>
      </div>
    </div>
  </div>

  <script>
    function validateLogin() {
      var user = document.getElementById('usernameInput').value.trim();
      var pass = document.getElementById('passwordInput').value;
      var err = document.getElementById('errorAlert');
      var errMsg = document.getElementById('errorAlertMsg');
      
      err.classList.add('hidden');

      if (!user || !pass) {
        errMsg.innerText = "Sila lengkapkan isian username dan kata kunci!";
        err.classList.remove('hidden');
        return;
      }

      // Admin verification
      if (user === 'Admin' && pass === 'mkks037') {
        window.top.location.href = "?page=admin";
        return;
      }

      // User verification mock
      if (user === 'user@test.com' && pass === 'password123') {
        window.top.location.href = "?page=user";
        return;
      }

      errMsg.innerText = "Username/Email atau Password yang diinput tidak sesuai.";
      err.classList.remove('hidden');
    }
  </script>

</body>
</html>
